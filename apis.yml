aid: wave-ai
name: Wave AI
description: >-
  Wave AI (WaveAI) is a Sunnyvale, California AI music company founded in 2017 by
  David Loker, Dr. Maya Ackerman, and Chris Cassion, building foundational generative
  AI models for music and songwriting. Its flagship product LyricStudio is an
  AI-powered lyric-writing assistant used by millions of artists and creators to
  generate genre- and topic-aware lyrical suggestions, rhymes, and full songs, and
  MelodyStudio adds generative vocal-melody and chord generation. The company is
  backed by 500 Global, Horizon 3 Venture Capital, Kilowatt Capital, and angel
  investors. Wave AI ships consumer web applications rather than a public developer
  API; this profile captures its company identity and public web properties. Added to
  the API Evangelist network as a 500 Global portfolio lead and enriched with a
  domain-security probe and verified public link properties.
